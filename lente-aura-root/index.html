<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lente DIA — AURA + ROOT en tu lámina</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#05070b;color:#eaf2ff;font-family:system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px;gap:10px;z-index:10;pointer-events:none}
  .bar{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(5,10,18,.78);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:10px 12px;backdrop-filter:blur(10px);max-width:96vw}
  button{border-radius:999px;border:1px solid rgba(255,255,255,.2);background:#16233a;color:#fff;padding:11px 18px;font-weight:800;cursor:pointer;font-size:14px}
  button.pri{background:#38e1ff;color:#03222b;border-color:#38e1ff} button.gold{background:#f0c75e;color:#241a02;border-color:#f0c75e}
  #status{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;font-size:13px;max-width:94vw;text-align:center;pointer-events:auto}
  #hint{font-size:11px;color:#9fb0c8;text-align:center;max-width:94vw;pointer-events:auto}
  #extra{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
  #extra.closed{display:none}
  @media(max-width:700px){
    #ui{gap:6px;padding:8px}
    #status{font-size:12px;padding:7px 10px;max-width:96vw}
    .bar{padding:7px 8px;gap:6px;border-radius:14px;max-width:96vw}
    .bar button{padding:8px 11px;font-size:12px}
    #hint{display:none}
    #extra{gap:6px}
  }
  #ar{position:fixed;inset:0} video,canvas{position:absolute!important;inset:0;margin:auto}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","mindar":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body>
<div id="ar"></div>
<div id="ui">
  <div id="status">📄 Imprimí la lámina en A4 mate. Después tocá <b>Abrir cámara</b> y enfocala.</div>
  <div class="bar">
    <button class="pri" id="start">📷 Abrir cámara</button>
    <button id="stop">Detener</button>
    <button class="gold" id="sound">🔊 Activar sonido</button>
    <button id="mode">Modo: video</button>
    <button id="more" title="Mostrar más controles">⚙</button>
  </div>
  <div id="extra">
  <div class="bar">
    <button class="pri" id="chAmbos">Ambos</button>
    <button id="chAura">Solo AURA</button>
    <button id="chRoot">Solo ROOT</button>
  </div>
  <div class="bar">
    <button class="pri" id="vAura">🎙 Hablar con AURA</button>
    <button class="pri" id="vRoot">🎙 Hablar con ROOT</button>
    <button id="vStop">Cortar voz</button>
    <span id="vdots" style="font-size:12px;align-self:center">⚪ AURA ⚪ ROOT</span>
  </div>
  <div id="hint">La cámara solo funciona en <b>https</b> (GitHub Pages), no abriendo el archivo suelto. Si el video sale mudo, tocá Activar sonido. AURA y ROOT son recreaciones con IA (fines educativos).</div>
  </div>
</div>
<video id="clip" playsinline loop muted crossorigin="anonymous" style="display:none"></video>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar';
const $=id=>document.getElementById(id);
const status=t=>{$('status').innerHTML=t;};
let mindar=null, started=false, mode='video', videoOK=false, soundOn=false;
let currentChar='ambos', tagMesh=null, voiceConv=null, voiceWho=null, voiceSpeaking=false;
const AURA_ID='agent_8301m50tb78effcsq2q0jfhxgm6y', ROOT_ID='agent_2701m50vk6p4ed1a26b4shgzf6wb';
function tagTexture(label){ const c=document.createElement('canvas'); c.width=512;c.height=96; const x=c.getContext('2d');
  x.fillStyle='rgba(0,0,0,.8)'; x.fillRect(0,0,512,96); x.fillStyle='#38e1ff'; x.font='bold 36px sans-serif'; x.textAlign='center'; x.fillText(label.slice(0,26),256,60);
  const t=new THREE.CanvasTexture(c); return t; }
function setChar(c){ currentChar=c;
  for(const [id,on] of [['chAmbos',c==='ambos'],['chAura',c==='A'],['chRoot',c==='R']]) $(id).classList.toggle('pri',on);
  const label=c==='ambos'?'AURA + ROOT · Lente DIA':c==='A'?'AURA · historia chaqueña':'ROOT · IA y tecnología';
  if(tagMesh){ const old=tagMesh.material.map; tagMesh.material.map=tagTexture(label); tagMesh.material.needsUpdate=true; if(old)old.dispose(); }
  if(c==='A'){ status('🤖 Solo AURA sobre la lámina. Conecto su voz…'); talkVoice('A'); }
  else if(c==='R'){ status('🧒 Solo ROOT sobre la lámina. Conecto su voz…'); talkVoice('R'); }
  else status('🤖🧒 Ambos sobre la lámina. Elegí con quién hablar por voz.');
  if(window.__lensRefresh) window.__lensRefresh(); }
$('chAmbos').onclick=()=>setChar('ambos'); $('chAura').onclick=()=>setChar('A'); $('chRoot').onclick=()=>setChar('R');
function paintDots(){ const el=$('vdots'); if(el) el.textContent=(voiceWho==='A'?(voiceSpeaking?'🔵':'🟢'):'⚪')+' AURA '+(voiceWho==='R'?(voiceSpeaking?'🔵':'🟢'):'⚪')+' ROOT'; }
async function talkVoice(who){ const id=who==='A'?AURA_ID:ROOT_ID, name=who==='A'?'AURA':'ROOT';
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }
  catch(e){ status('🎙 Permití el <b>micrófono</b> para hablar con '+name+'.'); return; }
  status('⌛ Conectando voz con '+name+'…');
  try{ if(voiceConv) try{ await voiceConv.endSession(); }catch(e){} voiceConv=null;
    const mod=await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/dist/index.js').catch(()=>import('https://esm.sh/@elevenlabs/client@1.26.0'));
    voiceConv=await mod.Conversation.startSession({ agentId:id,
      onConnect:()=>{ voiceWho=who; paintDots(); status('🎙 Habla: te escucha '+name+' (por el parlante del celu).'); },
      onDisconnect:()=>{ voiceWho=null; voiceSpeaking=false; paintDots(); },
      onError:e=>status('❌ Voz: '+String(e?.message||e).slice(0,120)),
      onMessage:m=>{ const t=m?.message||m?.text; if(t) status('<b>'+name+':</b> '+t); },
      onModeChange:mo=>{ voiceSpeaking=(mo?.mode==='speaking'); paintDots(); }
    });
  }catch(err){ status('❌ Voz: '+err.message+' ¿Agente público? ¿https?'); } }
$('vAura').onclick=()=>talkVoice('A'); $('vRoot').onclick=()=>talkVoice('R');
$('vStop').onclick=async()=>{ try{ await voiceConv?.endSession(); }catch(e){} voiceConv=null; voiceWho=null; voiceSpeaking=false; paintDots(); status('Voz cortada. La cámara sigue activa.'); };
// Query: ?video=URL ?model=URL ?marker=URL
const q=new URLSearchParams(location.search);
const MARKER=q.get('marker')||'./targets.mind';
const VIDEO_SRC=q.get('video')||'./video.mp4';
const MODEL_SRC=q.get('model')||'./aura.glb';
$('clip').src=VIDEO_SRC;
$('clip').addEventListener('canplay',()=>{videoOK=true;});
$('clip').load();
$('sound').onclick=()=>{ soundOn=true; const v=$('clip'); v.muted=false; v.play().catch(()=>{}); status('🔊 Sonido activado. Enfocá la lámina.'); };
$('mode').onclick=e=>{ mode=(mode==='video')?'3d':'video'; e.target.textContent='Modo: '+mode; status(mode==='video'?'📹 Video flotando sobre la lámina.':'🧊 Personajes 3D sobre la lámina (AURA / ROOT).'); if(window.__lensRefresh) window.__lensRefresh(); };
if(window.innerWidth<700){ $('extra').classList.add('closed'); }
$('more').onclick=()=>{ $('extra').classList.toggle('closed'); };
$('stop').onclick=async()=>{ try{await mindar?.stop();}catch(e){} started=false; status('Cámara detenida.'); };
$('start').onclick=async()=>{
  if(started) return;
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error('Sin soporte'),{name:'NoSupport'});
    if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.protocol!=='file:') throw Object.assign(new Error('Sin https'),{name:'NotSecure'});
    status('📷 Pedimos permiso de cámara… tocá <b>PERMITIR</b> en el aviso del navegador.');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    stream.getTracks().forEach(t=>t.stop());
    status('✅ Cámara permitida. Cargando marcador… (apuntá a la lámina)');
    mindar=new MindARThree({ container:document.querySelector('#ar'), imageTargetSrc:MARKER, maxTrack:1 });
    const {renderer,scene,camera}=mindar;
    const anchor=mindar.addAnchor(0);
    // Plano de video 16:9 flotando sobre la lámina
    const v=$('clip');
    const vtex=new THREE.VideoTexture(v);
    const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.84),new THREE.MeshBasicMaterial({map:vtex,transparent:false,side:THREE.DoubleSide}));
    plane.position.set(0,0.15,0.05); plane.visible=false; anchor.group.add(plane);
    // Marco dorado + etiqueta
    const frame=new THREE.Mesh(new THREE.BoxGeometry(1.58,0.92,0.02),new THREE.MeshBasicMaterial({color:0xf0c75e}));
    frame.position.set(0,0.15,0.02); frame.visible=false; anchor.group.add(frame);
    // Etiqueta (cambia según personaje: Ambos / AURA / ROOT)
    tagMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.2),new THREE.MeshBasicMaterial({map:tagTexture('AURA + ROOT · Lente DIA'),transparent:true,side:THREE.DoubleSide}));
    tagMesh.position.set(0,0.75,0.05); tagMesh.visible=false; anchor.group.add(tagMesh);
    const tag=tagMesh;
    // Mismos personajes del escenario (AURA + ROOT idénticos)
    const mRed=new THREE.MeshStandardMaterial({color:0xd63a2f,metalness:.55,roughness:.35,side:THREE.DoubleSide});
    const mGold=new THREE.MeshStandardMaterial({color:0xf2b73d,metalness:.7,roughness:.3,side:THREE.DoubleSide});
    const mSkin=new THREE.MeshStandardMaterial({color:0xf2c9a4,roughness:.65});
    const mCream=new THREE.MeshStandardMaterial({color:0xf6e3c2,roughness:.6});
    const mWhite=new THREE.MeshStandardMaterial({color:0xf4f7fb,roughness:.5,side:THREE.DoubleSide});
    const mCyan=new THREE.MeshStandardMaterial({color:0x06222b,emissive:0x38e1ff,emissiveIntensity:2.4});
    const mFire=new THREE.MeshStandardMaterial({color:0x331100,emissive:0xff8a1a,emissiveIntensity:2.6});
    const mHair=new THREE.MeshStandardMaterial({color:0x2a2018,roughness:.8});
    const mGlass=new THREE.MeshStandardMaterial({color:0x111111,metalness:.4,roughness:.4});
    const LM=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o;};
    function lensMouth(lipColor){ const g=new THREE.Group();
      const lips=LM(new THREE.BoxGeometry(0.2,0.045,0.02),new THREE.MeshStandardMaterial({color:lipColor,roughness:.5}),0,0,0.01);g.add(lips);
      const inner=LM(new THREE.PlaneGeometry(0.18,0.15),new THREE.MeshBasicMaterial({color:0x0a0505}),0,-0.03,-0.005);g.add(inner);
      const teeth=LM(new THREE.PlaneGeometry(0.16,0.04),new THREE.MeshBasicMaterial({color:0xffffff}),0,0.02,0);g.add(teeth);
      const tongue=LM(new THREE.PlaneGeometry(0.09,0.055),new THREE.MeshBasicMaterial({color:0xd46a7a}),0,-0.075,0);g.add(tongue);
      return {g,lips,inner,teeth,tongue,open:0,wide:0,round:0,t:{open:0,wide:0,round:0},
        apply(e,dt){const k=1-Math.pow(0.0001,dt);this.open+=(this.t.open-this.open)*k;this.wide+=(this.t.wide-this.wide)*k;this.round+=(this.t.round-this.round)*k;
          const h=Math.max(0.008,this.open*0.16*(0.4+e*1.4)+this.round*0.09+0.008);const w=0.11+this.wide*0.11+this.open*0.03-this.round*0.04;
          this.lips.scale.set(Math.max(0.3,w/0.2),Math.max(0.25,h/0.045),1);this.inner.scale.set(Math.max(0.05,w/0.18),Math.max(0.05,h/0.15),1);
          this.inner.visible=h>0.015;this.teeth.visible=h>0.02;this.tongue.visible=this.open>0.25;}}; }
    function lensSetT(mo,v,a=1){mo.t={open:0,wide:0,round:0};if(v==='A')mo.t.open=a;else if(v==='E')mo.t.wide=a;else if(v==='O')mo.t.round=a;else if(v==='N')mo.t.open=0.15*a;}
    function lensAura(){ const g=new THREE.Group();
      const torso=LM(new THREE.CapsuleGeometry(0.4,0.45,6,16),mRed,0,1.3,0);torso.rotation.x=-0.25;g.add(torso);
      g.add(LM(new THREE.BoxGeometry(0.46,0.36,0.16),mGold,0,1.45,0.3));
      g.add(LM(new THREE.TorusGeometry(0.1,0.025,10,24),mGold,0,1.45,0.4));
      g.add(LM(new THREE.CircleGeometry(0.088,24),mCyan,0,1.45,0.405));
      const head=new THREE.Group();head.position.set(0,2.05,0.08);g.add(head);
      const hel=LM(new THREE.SphereGeometry(0.36,24,24),mRed,0,0,0);hel.scale.set(1.08,1,1.02);head.add(hel);
      const face=LM(new THREE.SphereGeometry(0.28,20,20),mCream,0,-0.04,0.17);face.scale.set(0.95,0.9,0.7);head.add(face);
      const eL=LM(new THREE.SphereGeometry(0.065,14,14),mCyan,-0.11,0.02,0.34);eL.scale.set(1.3,0.9,0.5);head.add(eL);
      const eR=eL.clone();eR.position.x=0.11;head.add(eR);
      const mo=lensMouth(0x7a1f1f);mo.g.position.set(0,-0.17,0.36);head.add(mo.g);
      const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(0.5*s,1.55,0);
        a.add(LM(new THREE.SphereGeometry(0.15,14,14),mGold,0,0,0));
        a.add(LM(new THREE.CylinderGeometry(0.1,0.09,0.4,12),mRed,0,-0.26,0));
        a.add(LM(new THREE.SphereGeometry(0.11,12,12),mRed,0,-0.52,0));g.add(a);arms.push(a);}
      const fl=[];for(const s of[-1,1]){const f=LM(new THREE.ConeGeometry(0.09,0.5,12),mFire,0.2*s,0.75,-0.25);f.rotation.x=-2.6;g.add(f);fl.push(f);}
      g.scale.setScalar(0.5);g.visible=false;anchor.group.add(g);return{g,head,mo,arms,fl}; }
    function lensRoot(){ const g=new THREE.Group();
      const coat=LM(new THREE.CapsuleGeometry(0.36,0.5,6,16),mWhite,0,1.28,0);coat.rotation.x=-0.22;g.add(coat);
      g.add(LM(new THREE.BoxGeometry(0.3,0.28,0.05),new THREE.MeshStandardMaterial({color:0x38e1ff,roughness:.4}),0,1.42,0.34));
      const head=new THREE.Group();head.position.set(0,2.02,0.08);g.add(head);
      head.add(LM(new THREE.SphereGeometry(0.34,26,26),mSkin,0,0,0));
      head.add(LM(new THREE.SphereGeometry(0.35,24,18,0,Math.PI*2,0,1.5),mHair,0,0.05,-0.03));
      for(const s of[-1,1]){ head.add(LM(new THREE.SphereGeometry(0.06,12,12),mSkin,0.34*s,-0.02,0)); }
      const eM=new THREE.MeshStandardMaterial({color:0x3a2415,roughness:.4});
      head.add(LM(new THREE.SphereGeometry(0.05,14,14),eM,-0.11,0.0,0.3));
      head.add(LM(new THREE.SphereGeometry(0.05,14,14),eM,0.11,0.0,0.3));
      head.add(LM(new THREE.TorusGeometry(0.095,0.014,10,24),mGlass,-0.115,0.0,0.31));
      head.add(LM(new THREE.TorusGeometry(0.095,0.014,10,24),mGlass,0.115,0.0,0.31));
      head.add(LM(new THREE.CircleGeometry(0.088,20),new THREE.MeshStandardMaterial({color:0xbfeaff,transparent:true,opacity:0.28}),-0.115,0.0,0.315));
      head.add(LM(new THREE.CircleGeometry(0.088,20),new THREE.MeshStandardMaterial({color:0xbfeaff,transparent:true,opacity:0.28}),0.115,0.0,0.315));
      head.add(LM(new THREE.BoxGeometry(0.06,0.014,0.014),mGlass,0,0.01,0.31));
      head.add(LM(new THREE.SphereGeometry(0.035,10,10),new THREE.MeshStandardMaterial({color:0xe8b08a}),0,-0.07,0.32));
      for(const s of[-1,1]){ const ch=LM(new THREE.SphereGeometry(0.05,10,10),new THREE.MeshStandardMaterial({color:0xf0a8a8,transparent:true,opacity:.55}),0.16*s,-0.08,0.26); ch.scale.z=0.4; head.add(ch); }
      const mo=lensMouth(0xb96a6a);mo.g.position.set(0,-0.17,0.31);head.add(mo.g);
      const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(0.46*s,1.55,0);
        a.add(LM(new THREE.CylinderGeometry(0.09,0.085,0.4,12),mWhite,0,-0.24,0));
        a.add(LM(new THREE.SphereGeometry(0.09,12,12),mSkin,0,-0.5,0));g.add(a);arms.push(a);}
      g.add(LM(new THREE.BoxGeometry(0.3,0.2,0.02),new THREE.MeshStandardMaterial({color:0x0b1626}),-0.1,1.05,0.35));
      const holo=LM(new THREE.PlaneGeometry(0.34,0.22),new THREE.MeshBasicMaterial({color:0x38e1ff,transparent:true,opacity:0.35,side:THREE.DoubleSide}),-0.1,1.25,0.35);g.add(holo);
      const fl=[];for(const s of[-1,1]){const f=LM(new THREE.ConeGeometry(0.085,0.48,12),mFire,0.18*s,0.72,-0.22);f.rotation.x=-2.6;g.add(f);fl.push(f);}
      g.scale.setScalar(0.5);g.visible=false;anchor.group.add(g);return{g,head,mo,arms,fl,holo}; }
    const A3=lensAura(), R3=lensRoot();
    let targetVisible=false;
    function refreshVis(){ const showV=targetVisible&&mode==='video';
      plane.visible=showV; frame.visible=showV;
      if(showV) v.play().catch(()=>{}); else v.pause();
      const show3=targetVisible&&mode==='3d';
      A3.g.visible=show3&&(currentChar==='ambos'||currentChar==='A');
      R3.g.visible=show3&&(currentChar==='ambos'||currentChar==='R');
      A3.g.position.set(currentChar==='A'?0:-0.35,-0.55,0.1);
      R3.g.position.set(currentChar==='R'?0:0.35,-0.55,0.1);
      tag.visible=targetVisible; }
    window.__lensRefresh=refreshVis;
    anchor.onTargetFound=()=>{ targetVisible=true; status('✅ ¡Lámina detectada! '+(mode==='3d'?'Aparecen en 3D: '+({ambos:'AURA y ROOT',A:'AURA',R:'ROOT'})[currentChar]+'.':'Aparece tu humano digital.')); refreshVis(); };
    anchor.onTargetLost=()=>{ targetVisible=false; refreshVis(); status('🔎 Buscando marcador… enfocá la lámina con buena luz, sin reflejos.'); };
    const clock=new THREE.Clock();
    renderer.setAnimationLoop(()=>{ const dt=Math.min(0.05,clock.getDelta()),t=clock.elapsedTime;
      plane.position.y=0.15+Math.sin(t*1.6)*0.03; tag.position.y=0.75+Math.sin(t*1.6+1)*0.02;
      const pulse=(voiceSpeaking&&tag.visible)?1+Math.sin(t*10)*0.07:1; tag.scale.set(pulse,pulse,1);
      for(const [C,who,off] of [[A3,'A',0],[R3,'R',2]]){ if(!C.g.visible) continue;
        C.g.position.y=-0.55+Math.sin(t*1.8+off)*0.05; C.g.rotation.y=Math.sin(t*0.7+off)*0.15;
        const talk=voiceSpeaking&&voiceWho===who;
        if(talk){ C.n=(C.n||0)+dt; if(C.n>0.16){ C.n=0; lensSetT(C.mo,['A','E','O'][Math.floor(Math.random()*3)],0.9); } }
        else { C.mo.t.open*=0.9; C.mo.t.wide*=0.9; C.mo.t.round*=0.9; }
        C.mo.apply(talk?0.8:0,dt);
        C.head.rotation.y=Math.sin(t*0.9+off)*0.2;
        C.fl.forEach((f,i)=>f.scale.set(1,1+Math.sin(t*24+i*2+off)*0.25+(talk?0.4:0),1));
        if(C.holo) C.holo.material.opacity=0.28+Math.sin(t*4)*0.1; }
      renderer.render(scene,camera); });
    await mindar.start(); started=true; status('🔎 Buscando marcador… enfocá la lámina impresa.');
  }catch(err){ const n=err?.name||'';
    if(n==='NotAllowedError') status('⛔ Permiso <b>denegado</b>. Activá la cámara:<br>Chrome Android: tocá el 🔒 candado de la barra → Permisos → Cámara → <b>Permitir</b> y recargá.<br>iPhone: Ajustes → Safari → Cámara → Permitir, y en el aviso tocá Permitir.<br>Si ya la bloqueaste: Ajustes → Apps → Chrome → Permisos → Cámara.');
    else if(n==='NotFoundError'||n==='OverconstrainedError') status('❌ No se encontró cámara. Probá en otro celular.');
    else if(n==='NotSecure'||n==='NotSecureError') status('🔒 La cámara exige <b>https</b>. Publicá la lente en GitHub Pages y abrila desde el celular, no el archivo suelto.');
    else if(n==='NoSupport') status('❌ Este navegador no soporta cámara web. Usá Chrome o Safari actualizados.');
    else status('❌ Error: '+(err?.message||err)+'<br>¿Subiste targets.mind junto al index? ¿Hay buena luz?'); }
};
</script>
