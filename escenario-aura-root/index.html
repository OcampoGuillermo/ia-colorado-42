{ const treeG=new THREE.ConeGeometry(0.35,1.1,7), treeM=new THREE.MeshStandardMaterial({color:0x2c5a30,roughness:1});

  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${lon-d*cos},${lat-d},${lon+d*cos},${lat+d}&bboxSR=4326&imageSR=4326&size=1024%2C1024&format=png32&f=image`; }
function flyToCity(raw,announce=true){ const key=(raw||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  const coat=M(new THREE.CapsuleGeometry(0.36,0.5,6,16),white,0,1.28,0);coat.rotation.x=-0.22;g.add(coat);
  g.add(M(new THREE.BoxGeometry(0.3,0.28,0.05),new THREE.MeshStandardMaterial({color:0x38e1ff,roughness:.4}),0,1.42,0.34));
  const head=new THREE.Group();head.position.set(0,2.02,0.08);g.add(head);
  head.add(M(new THREE.SphereGeometry(0.34,26,26),skin,0,0,0));
  const hair=M(new THREE.SphereGeometry(0.35,24,18,0,Math.PI*2,0,1.5),new THREE.MeshStandardMaterial({color:0x2a2018,roughness:.8}),0,0.05,-0.03);head.add(hair);
  for(const s of[-1,1]){head.add(M(new THREE.SphereGeometry(0.06,12,12),skin,0.34*s,-0.02,0));}
  const eM=new THREE.MeshStandardMaterial({color:0x3a2415,roughness:.4});
  const eL=M(new THREE.SphereGeometry(0.05,14,14),eM,-0.11,0.0,0.3);head.add(eL);const eR=eL.clone();eR.position.x=0.11;head.add(eR);
  const glM=new THREE.MeshStandardMaterial({color:0x111111,metalness:.4,roughness:.4});
  for(const s of[-1,1]){const r=M(new THREE.TorusGeometry(0.095,0.014,10,24),glM,0.115*s,0.0,0.31);head.add(r);
    head.add(M(new THREE.CircleGeometry(0.088,20),new THREE.MeshStandardMaterial({color:0xbfeaff,transparent:true,opacity:0.28}),0.115*s,0.0,0.315));}
  head.add(M(new THREE.BoxGeometry(0.06,0.014,0.014),glM,0,0.01,0.31));
  head.add(M(new THREE.SphereGeometry(0.035,10,10),new THREE.MeshStandardMaterial({color:0xe8b08a}),0,-0.07,0.32));
  for(const s of[-1,1]){const ch=M(new THREE.SphereGeometry(0.05,10,10),new THREE.MeshStandardMaterial({color:0xf0a8a8,transparent:true,opacity:.55}),0.16*s,-0.08,0.26);ch.scale.z=0.4;head.add(ch);}
  const mo=makeMouth(0xb96a6a);mo.g.position.set(0,-0.17,0.31);head.add(mo.g);
  const arms=[];for(const s of[-1,1]){const a=new THREE.Group();a.position.set(0.46*s,1.55,0);a.add(M(new THREE.CylinderGeometry(0.09,0.085,0.4,12),white,0,-0.24,0));a.add(M(new THREE.SphereGeometry(0.09,12,12),skin,0,-0.5,0));g.add(a);arms.push(a);}
  const tab=M(new THREE.BoxGeometry(0.3,0.2,0.02),new THREE.MeshStandardMaterial({color:0x0b1626}),-0.1,1.05,0.35);g.add(tab);
  const holo=M(new THREE.PlaneGeometry(0.34,0.22),new THREE.MeshBasicMaterial({color:0x38e1ff,transparent:true,opacity:0.35,side:THREE.DoubleSide}),-0.1,1.25,0.35);g.add(holo);g.userData.holo=holo;
  const fl=[];for(const s of[-1,1]){const f=M(new THREE.ConeGeometry(0.085,0.48,12),glowO,0.18*s,0.72,-0.22);f.rotation.x=-2.6;g.add(f);fl.push(f);}
  g.position.set(0.95,0.12,0);g.rotation.x=-0.12;scene.add(g);return{ g,head,mo,arms,fl,holo,queue:[],speaking:false,energy:0};}
const AURA=buildAura(), ROOT=buildRoot();

// cámaras
let camGoal=null;
function setCam(n){const P={wide:[new THREE.Vector3(0,1.9,6.2),new THREE.Vector3(0,1.4,0)],aura:[new THREE.Vector3(-1.1,1.9,3.0),new THREE.Vector3(-0.95,1.6,0)],root:[new THREE.Vector3(1.1,1.9,3.0),new THREE.Vector3(0.95,1.6,0)],vert:[new THREE.Vector3(0,1.7,4.6),new THREE.Vector3(0,1.45,0)],top:[new THREE.Vector3(0,6,1.5),new THREE.Vector3(0,0,0)]}[n]||[camera.position,controls.target];
  camGoal={p:P[0],t:P[1],s:performance.now()};$('camLabel').textContent='Cámara: '+n;}

// audio/elevenlabs por personaje
let ctx=null,an=null,buf=null;
async function ensureMic(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=512;buf=new Uint8Array(an.frequencyBinCount);
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});ctx.createMediaStreamSource(s).connect(an);}catch(e){log('mic bloqueado: '+e.message);}}
function energy(){if(!an)return 0;an.getByteTimeDomainData(buf);let sm=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sm+=v*v;}return Math.min(1,Math.sqrt(sm/buf.length)*4);}
function pushQ(ch,qs,ds,ds2){for(let i=0;i<ch.length;i++)ch&&qs.push({c:ch[i],t:performance.now()+(qs._t0!=null?0:0)+( (arguments[1]&&false)?0:0)});}
let convA=null,convR=null,duel=false;
const AURA_ID='agent_8301m50tb78effcsq2q0jfhxgm6y', ROOT_ID='agent_2701m50vk6p4ed1a26b4shgzf6wb';
$('duelo').onclick=e=>{duel=!duel;e.target.textContent='Duelo: '+(duel?'ON':'OFF (los dos responden)');};
async function connect(which){await ensureMic();await ctx.resume();
  const isA=which==='A', id=isA?AURA_ID:ROOT_ID, who=isA?AURA:ROOT;
  if(!id){log('falta id '+which);return;}
  setDot(which,'orange');log('conectando '+(isA?'AURA':'ROOT'));
  try{const mod=await import('https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/dist/index.js').catch(()=>import('https://esm.sh/@elevenlabs/client@1.26.0'));
    const C=which==='A'?convA:convR; if(C)try{await C.endSession();}catch(e){}
    const conv=await mod.Conversation.startSession({agentId:id,
      clientTools:{ viajar_a_ciudad: async ({ciudad})=>flyToCity(String(ciudad||'')) },
      onConnect:()=>{setDot(which,'lime');log('conectado '+which);},
      onDisconnect:()=>{setDot(which,'#555');who.speaking=false;},
      onError:e=>{log('err '+which+': '+(e?.message||JSON.stringify(e)).slice(0,200));},
      onMessage:m=>{const t=m?.message||m?.text;if(t){$('subs').textContent=(isA?'AURA: ':'ROOT: ')+t;detectCity(t);}
        const chs2=m?.chars||m?.alignment?.chars;if(chs2){const st=m?.char_start_times_ms||m?.alignment?.char_start_times_ms||[];const du=m?.char_durations_ms||m?.alignment?.char_durations_ms||[];const now=performance.now();chs2.forEach((c,i)=>who.queue.push({c,t:now+(st[i]||0),d:du[i]||90}));if(who.queue.length>400)who.queue=who.queue.slice(-400);}},
      onModeChange:mo=>{who.speaking=(mo?.mode==='speaking');setDot(which,who.speaking?'#38e1ff':'lime');if(who.speaking)setCam(isA?'aura':'root');}
    });
    if(isA)convA=conv;else convR=conv;
  }catch(err){log('fallo '+which+': '+err.message);setDot(which,'red');}
}
function setDot(w,c){$(w==='A'?'dA':'dR').style.background=c;}
$('cA').onclick=()=>connect('A');$('cR').onclick=()=>connect('R');
$('xA').onclick=async()=>{try{await convA?.endSession();}catch(e){}AURA.speaking=false;setDot('A','#555');};
$('xR').onclick=async()=>{try{await convR?.endSession();}catch(e){}ROOT.speaking=false;setDot('R','#555');};
$('lugar').onchange=e=>{const v=e.target.value;if(v.includes('Colorado'))flyToCity('el colorado');else if(v.includes('Bañado'))flyToCity('banado');else if(v.includes('Pilcomayo'))flyToCity('clorinda');else flyToCity('san ignacio');};
$('volar').onclick=()=>flyToCity($('ciudad').value||'formosa');

// demo sin conexión
$('demo2').onclick=()=>{const lines=[['A','Hola, soy AURA sobre el Bañado. Veo agua y palmas, historia viva del Pilcomayo.'],['R','Y yo mido 12 centímetros de crecida con boyas solares. Historia más datos cuidan mejor.']];playLines(lines,false);};

// guion
$('gen').onclick=()=>{const idea=$('idea').value.trim()||'el Bañado', lug=$('lugar').value;
  $('guion').value=`AURA: Volamos sobre ${lug}. ${idea}. Desde la historia, este monte y este río se defienden hace siglos. ¿Qué ves vos desde tu tablet?\nROOT: Veo sensores y drones: nivel del agua, focos de calor y cámaras trampa. La IA cuenta yacarés y predice crecidas. Mi pregunta: ¿qué tecnología llevarías a tu paraje?\nAURA: En El Colorado el Bermejo enseñó a sembrar con respeto. Obraje, quebracho y algodón marcaron generaciones. ¿Cómo sumamos datos sin perder memoria?\nROOT: Con estaciones solares en la escuela, datos abiertos y permiso de la comunidad. Ciencia con respeto. Cerramos con un desafío para el aula.`;log('guion generado');};
$('useCap').onclick=()=>{document.querySelector('[data-tab="cap"]').click();};

// cine con voz local
let playing=false,stopFlag=false;
function parseGuion(){return $('guion').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(AURA|ROOT)\s*:\s*(.*)/i);return m?{w:m[1][0]==='A'?'A':'R',t:m[2]}:{w:'A',t:s};});}
async function playLines(lines,wide=true){stopFlag=false;playing=true;
  for(const L of lines){if(stopFlag)break;const who=L.w==='A'?AURA:ROOT, other=L.w==='A'?ROOT:AURA;
    who.speaking=true;other.speaking=false;setCam(L.w==='A'?'aura':'root');$('subs').textContent=(L.w==='A'?'AURA: ':'ROOT: ')+L.t;
    await speak(L.t,who);who.speaking=false;await new Promise(r=>setTimeout(r,350));}
  playing=false;setCam('wide');}
function speak(text,who){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=1;
  u.onboundary=e=>{const c=text.slice(e.charIndex||0,(e.charIndex||0)+8).toLowerCase();const v=c.match(/[aeiouáéíóú]/);setT(who.mo,!v?'N':('aá'.includes(v[0])?'A':'eéií'.includes(v[0])?'E':'O'),0.9);};
  const iv=setInterval(()=>{if(!who.speaking){clearInterval(iv);return;}setT(who.mo,['A','E','O'][Math.floor(Math.random()*3)],0.4+who.energy);},240);
  u.onend=()=>{clearInterval(iv);res();};speechSynthesis.cancel();speechSynthesis.speak(u);});}
$('playCap').onclick=()=>{document.body.classList.remove('shortMode');onResize();playLines(parseGuion());};
$('playShort').onclick=()=>{document.body.classList.add('shortMode');onResize();setCam('vert');playLines(parseGuion());};
$('stopCap').onclick=$('stopShort').onclick=()=>{stopFlag=true;speechSynthesis.cancel();AURA.speaking=ROOT.speaking=false;};
// Secuencia para video: hablan primero, después viajan (lista para grabar con 2do celular)
$('seqVideo').onclick=async()=>{ const dest=$('destVideo').value||'el colorado';
  stopFlag=false; playing=true; setCam('wide');
  const pre=[ {w:'A',t:'Hola, somos AURA y ROOT, en vuelo sobre el Bañado La Estrella. Yo traigo la historia chaqueña.'}, {w:'R',t:'Y yo traigo la tecnología: sensores, drones e inteligencia artificial para cuidar este territorio.'}, {w:'A',t:'Hablamos primero aquí arriba, y ahora viajamos juntos para mostrarte la ciudad desde el aire.'} ];
  for(const L of pre){ if(stopFlag)break; const who=L.w==='A'?AURA:ROOT; who.speaking=true; (L.w==='A'?ROOT:AURA).speaking=false; setCam(L.w==='A'?'aura':'root'); $('subs').textContent=(L.w==='A'?'AURA: ':'ROOT: ')+L.t; await speak(L.t,who); who.speaking=false; await new Promise(r=>setTimeout(r,300)); }
  if(stopFlag){playing=false;return;}
  $('subs').textContent='✈ Viajando a '+dest+'… grabá ahora la llegada'; setCam('top'); flyToCity(dest,false); log('viaje video a '+dest);
  await new Promise(r=>setTimeout(r,2600)); if(stopFlag){playing=false;return;}
  const post=[ {w:'A',t:'Ya estamos sobrevolando. Abajo se ve la ciudad real con satélite. Esta tierra tiene historia de obrajes, ríos y comunidades.'}, {w:'R',t:'Y desde mi tablet confirmo los datos: nivel del agua, verde del monte y puntos de la escuela. Historia más tecnología, cuidado completo.'} ];
  for(const L of post){ if(stopFlag)break; const who=L.w==='A'?AURA:ROOT; who.speaking=true; (L.w==='A'?ROOT:AURA).speaking=false; setCam(L.w==='A'?'aura':'root'); $('subs').textContent=(L.w==='A'?'AURA: ':'ROOT: ')+L.t; await speak(L.t,who); who.speaking=false; await new Promise(r=>setTimeout(r,300)); }
  playing=false; setCam('wide'); $('subs').textContent='Secuencia lista — cortá la grabación aquí.'; log('secuencia video terminada'); };

// loop
const clock=new THREE.Clock();let frames=0,ft=performance.now();
function tickQ(who){const now=performance.now();while(who.queue.length&&now>who.queue[who.queue.length-1].t+2000)who.queue.shift();
  const c=who.queue.find(a=>now>=a.t&&now<=a.t+(a.d||90));if(c){const v=vism(c.c);if(v==='M')setT(who.mo,'M');else setT(who.mo,v,0.6+who.energy);return true;}return false;}
function onResize(){const w=canvas.clientWidth||canvas.parentElement.clientWidth,h=canvas.clientHeight||innerHeight*0.58;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',onResize);onResize();
function animate(){requestAnimationFrame(animate);const dt=Math.min(0.05,clock.getDelta()),t=clock.elapsedTime;
  for(const [W,x] of[[AURA,-0.95],[ROOT,0.95]]){W.g.position.y=0.13+Math.sin(t*1.8+x)*0.13;W.g.position.x=x+Math.sin(t*0.6)*0.05;W.g.rotation.z=Math.sin(t*0.9+x)*0.05;
    W.fl.forEach((f,i)=>f.scale.set(1,1+Math.sin(t*26+i*2)*0.25+(W.speaking?0.5:0),1));
    W.energy+=(((W.speaking?energy()*1.2+0.3:0.05))-W.energy)*Math.min(1,dt*5);
    const had=tickQ(W);if(W.speaking&&!had&&!playing)setT(W.mo,['A','E','O'][Math.floor(t*6)%3],0.35+W.energy);if(!W.speaking&&!had){W.mo.t.open*=0.9;W.mo.t.wide*=0.9;W.mo.t.round*=0.9;}
    W.mo.apply(W.energy,dt);W.head.rotation.y+=(THREE.MathUtils.clamp(controls.getAzimuthalAngle(),-1,1)*0.5-W.head.rotation.y)*Math.min(1,dt*4);
    if(W.holo)W.holo.material.opacity=0.28+Math.sin(t*4)*0.1;}
  ROOT.g.userData.holo.lookAt(camera.position);
  clouds.forEach((c,i)=>{c.position.x+=dt*0.2;if(c.position.x>10)c.position.x=-10;});
  if(camGoal){const p=(performance.now()-camGoal.s)/900,e=p>=1?1:1-Math.pow(1-p,3);camera.position.lerpVectors(camGoal._p0||camera.position,camGoal.p,0.12);controls.target.lerp(camGoal.t,0.12);if(p>=1)camGoal=null;else{if(!camGoal._p0)camGoal._p0=camera.position.clone();}}
  controls.update();renderer.render(scene,camera);
  frames++;const n=performance.now();if(n-ft>1000){$('fps').textContent=frames+' fps';frames=0;ft=n;}
}
log('escenario listo. Conectá AURA y ROOT (públicos).');buildBlocks(18);setLabel('Bañado La Estrella');flyToCity('banado',false);animate();
